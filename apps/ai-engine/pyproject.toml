[project]
name = "ai-engine"
version = "0.3.0"
description = "Capital Elite — motor de recomendação (Python)"
requires-python = ">=3.11"
# Manter em sincronia com requirements.txt
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.32.0,<1",
    "pydantic>=2.9.0,<3",
    "lightgbm>=4.6.0,<5",
    "scikit-learn>=1.5.0,<2",
    "pandas>=2.2.0,<4",
    "joblib>=1.4.0,<2",
    "numpy>=2.0.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10",
    "httpx>=0.27.0,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000
